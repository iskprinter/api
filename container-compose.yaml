networks:
  iskprinter:
    driver: bridge
    name: api
services:
  cassandra:
    container_name: cassandra
    hostname: cassandra
    image: docker.io/library/cassandra:5
    networks:
      - iskprinter
    ports:
      - 9042:9042
    environment:
      CASSANDRA_CLUSTER_NAME: iskprinter
    volumes:
      - cassandra:/var/lib/cassandra
volumes:
  cassandra: {}
