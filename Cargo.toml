[package]
name = "iskprinter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
cdrs-tokio = "8.1.7"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
warp = "0.3.7"
